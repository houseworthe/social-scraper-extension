<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 360px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0f1419;
      color: #e7e9ea;
    }
    .header {
      padding: 16px 20px;
      background: linear-gradient(135deg, #0095f6, #fe2c55);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 { font-size: 16px; font-weight: 700; }
    .header .count {
      background: rgba(255,255,255,0.2);
      padding: 2px 10px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
    }
    .tabs {
      display: flex;
      border-bottom: 1px solid #2f3336;
    }
    .tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      color: #71767b;
      border-bottom: 2px solid transparent;
      transition: all 0.2s;
    }
    .tab.active {
      color: #e7e9ea;
      border-bottom-color: #0095f6;
    }
    .actions {
      padding: 16px 20px;
      display: flex;
      gap: 8px;
    }
    .btn {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:hover { opacity: 0.85; }
    .btn-export { background: #0095f6; color: white; }
    .btn-clear { background: #2f3336; color: #e7e9ea; }
    .btn-copy { background: #2f3336; color: #e7e9ea; }
    .data-list {
      max-height: 300px;
      overflow-y: auto;
      padding: 0 20px 16px;
    }
    .data-item {
      padding: 10px 0;
      border-bottom: 1px solid #1d2024;
      font-size: 12px;
    }
    .data-item .platform {
      display: inline-block;
      padding: 1px 8px;
      border-radius: 4px;
      font-size: 10px;
      font-weight: 700;
      text-transform: uppercase;
      margin-right: 6px;
    }
    .platform-Instagram { background: rgba(0,149,246,0.2); color: #0095f6; }
    .platform-TikTok { background: rgba(254,44,85,0.2); color: #fe2c55; }
    .data-item .caption { color: #71767b; margin-top: 4px; }
    .data-item .stats { color: #71767b; margin-top: 4px; }
    .empty {
      text-align: center;
      padding: 40px 20px;
      color: #71767b;
      font-size: 13px;
    }
    .instructions {
      padding: 12px 20px;
      background: #1d2024;
      font-size: 11px;
      color: #71767b;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>📋 Social Scraper</h1>
    <span class="count" id="count">0 scraped</span>
  </div>

  <div class="instructions">
    Navigate to any Instagram post, Reel, or TikTok video and click the floating "Scrape Post" button. Come back here to export your data.
  </div>

  <div class="actions">
    <button class="btn btn-export" id="export">Export CSV</button>
    <button class="btn btn-copy" id="copy">Copy JSON</button>
    <button class="btn btn-clear" id="clear">Clear</button>
  </div>

  <div class="data-list" id="dataList">
    <div class="empty">No posts scraped yet. Go scrape something!</div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
